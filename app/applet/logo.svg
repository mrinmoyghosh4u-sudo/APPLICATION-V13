<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423" />
      <stop offset="100%" stop-color="#FF4E50" />
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b09b" />
      <stop offset="100%" stop-color="#96c93d" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg-grad)" />
  
  <circle cx="512" cy="450" r="320" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20, 15" opacity="0.15" />
  <circle cx="512" cy="450" r="260" fill="none" stroke="#F9D423" stroke-width="2" opacity="0.3" />

  <g transform="translate(240, 200)">
    <!-- Vertical stem of K -->
    <path d="M 80 0 L 160 0 L 160 400 L 80 400 Z" fill="url(#gold-grad)" rx="10" />
    
    <!-- Bottom diagonal of K -->
    <path d="M 160 200 L 360 450 L 460 450 L 260 200 Z" fill="url(#gold-grad)" />
    
    <!-- Top diagonal of K (The Chart Arrow) -->
    <path d="M 170 250 L 400 -20 L 500 -20 L 270 250 Z" fill="url(#green-grad)" />
    
    <!-- Upward Arrow Head on the top right of the Green diagonal -->
    <polygon points="340,-20 540,-20 540,140" fill="url(#green-grad)" />

    <!-- AI Nodes -->
    <circle cx="120" cy="0" r="30" fill="#FF4E50" />
    <circle cx="120" cy="400" r="30" fill="#FF4E50" />
    <circle cx="410" cy="450" r="30" fill="#FF4E50" />
    
    <circle cx="120" cy="225" r="45" fill="#ffffff" />
    
    <!-- Connectivity lines -->
    <line x1="120" y1="225" x2="410" y2="450" stroke="#ffffff" stroke-width="4" opacity="0.5" />
    <line x1="120" y1="225" x2="440" y2="60" stroke="#ffffff" stroke-width="4" opacity="0.5" />
    <circle cx="440" cy="60" r="15" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="512" y="800" font-family="sans-serif" font-weight="900" font-size="95" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">KING KHAN</text>
  <text x="512" y="890" font-family="sans-serif" font-weight="700" font-size="50" fill="#96c93d" text-anchor="middle" letter-spacing="12">AI TRADE PRO</text>
</svg>
