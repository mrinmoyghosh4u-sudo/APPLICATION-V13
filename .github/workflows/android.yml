name: Build Android APK

on:
  push:
    branches: [ "main", "master", "kilo/wandering-fractal-6zj" ]
  pull_request:
    branches: [ "main", "master", "kilo/wandering-fractal-6zj" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=\"-Xmx2048m -XX:MaxMetaspaceSize=512m\""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Ensure .env file exists and populate secrets
        env:
          ANGEL_ONE_API_KEY: ${{ secrets.ANGEL_ONE_API_KEY || secrets.ANGEL_API_KEY || 'DEFAULT_ANGEL_KEY' }}
          ANGEL_REDIRECT_URI: ${{ secrets.ANGEL_REDIRECT_URI || 'kingkhan://oauth/callback' }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID || 'DEFAULT_DHAN_CLIENT_ID' }}
          DHAN_CLIENT_SECRET: ${{ secrets.DHAN_CLIENT_SECRET || 'DEFAULT_DHAN_CLIENT_SECRET' }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY || secrets.DHAN_CLIENT_SECRET || 'DEFAULT_DHAN_API_KEY' }}
          DHAN_REDIRECT_URI: ${{ secrets.DHAN_REDIRECT_URI || 'kingkhan://oauth/callback' }}
        run: |
          echo "ANGEL_ONE_API_KEY=${ANGEL_ONE_API_KEY}" > .env
          echo "ANGEL_REDIRECT_URI=${ANGEL_REDIRECT_URI}" >> .env
          echo "DHAN_CLIENT_ID=${DHAN_CLIENT_ID}" >> .env
          echo "DHAN_API_KEY=${DHAN_API_KEY}" >> .env
          echo "DHAN_CLIENT_SECRET=${DHAN_CLIENT_SECRET}" >> .env
          echo "DHAN_REDIRECT_URI=${DHAN_REDIRECT_URI}" >> .env
          echo "UPSTOX_API_KEY=${{ secrets.UPSTOX_API_KEY || 'DEFAULT_UPSTOX_KEY' }}" >> .env
          echo "UPSTOX_API_SECRET=${{ secrets.UPSTOX_API_SECRET || 'DEFAULT_UPSTOX_SECRET' }}" >> .env
          echo "UPSTOX_REDIRECT_URI=${{ secrets.UPSTOX_REDIRECT_URI || 'https://application-beige-psi.vercel.app/oauth' }}" >> .env
          echo "FYERS_APP_ID=${{ secrets.FYERS_APP_ID || 'DEFAULT_FYERS_APP_ID' }}" >> .env
          echo "FYERS_SECRET_ID=${{ secrets.FYERS_SECRET_ID || 'DEFAULT_FYERS_SECRET_ID' }}" >> .env
          echo "FYERS_REDIRECT_URI=${{ secrets.FYERS_REDIRECT_URI || 'https://application-beige-psi.vercel.app/oauth' }}" >> .env

      - name: Decode Production Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding production RELEASE_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || 'androiddebugkey' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding persistent production debug.keystore.base64 from repository..."
            base64 -d debug.keystore.base64 > "${{ github.workspace }}/debug.keystore"
            echo "KEYSTORE_PATH=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          elif [ -f "debug.keystore" ]; then
            echo "Using persistent production debug.keystore from repository..."
            echo "KEYSTORE_PATH=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "ERROR: Production signing keystore is missing. Refusing to generate a new signing key because this would break app updates."
            exit 1
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if ! jar -tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is invalid or corrupt. Regenerating wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          VERSION_CODE=$((${{ github.run_number }} + 50))
          ./gradlew assembleRelease -PversionCode=$VERSION_CODE -PversionName=1.0.$VERSION_CODE --no-daemon

      - name: Verify Release APK and Signature Certificate
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK build failed. Release APK file not found at $APK_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          echo "Found Release APK at $APK_PATH (Size: $SIZE bytes)"
          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Release APK file size is 0 bytes"
            exit 1
          fi

          echo "=== Printing Release APK Certificate Information ==="
          CERT_OUTPUT=$(keytool -printcert -jarfile "$APK_PATH")
          echo "$CERT_OUTPUT"

          FINGERPRINT=$(echo "$CERT_OUTPUT" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          if [ -z "$FINGERPRINT" ]; then
            echo "ERROR: Failed to extract SHA256 signing fingerprint from built APK."
            exit 1
          fi
          echo "Release APK SHA256 Fingerprint: $FINGERPRINT"

          VERSION_CODE=$((${{ github.run_number }} + 50))
          TAG_NAME="v1.0.$VERSION_CODE"
          NAMED_APK="app/build/outputs/apk/release/KING-KHAN-AI-TRADE-${TAG_NAME}.apk"
          cp "$APK_PATH" "$NAMED_APK"
          echo "Created named APK artifact at $NAMED_APK"

      - name: Create Git Tag and Published GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION_CODE=$((${{ github.run_number }} + 50))
          TAG_NAME="v1.0.$VERSION_CODE"
          TITLE="KING KHAN AI TRADE $TAG_NAME"
          BODY="KING KHAN AI TRADE Automated Release $TAG_NAME from commit ${{ github.sha }}."
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          NAMED_APK_PATH="app/build/outputs/apk/release/KING-KHAN-AI-TRADE-${TAG_NAME}.apk"

          echo "Checking if release $TAG_NAME already exists..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Uploading/updating release assets..."
          else
            echo "Creating Published GitHub Release $TAG_NAME via GitHub API..."
            gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="${{ github.sha }}" \
              -f name="$TITLE" \
              -f body="$BODY" \
              -F draft=false \
              -F prerelease=false
          fi

          echo "Uploading release assets ($NAMED_APK_PATH, $APK_PATH)..."
          gh release upload "$TAG_NAME" "$NAMED_APK_PATH" "$APK_PATH" --clobber

      - name: Verify GitHub Release and Asset
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION_CODE=$((${{ github.run_number }} + 50))
          TAG_NAME="v1.0.$VERSION_CODE"
          echo "Verifying published release $TAG_NAME on GitHub..."

          RELEASE_INFO=$(gh release view "$TAG_NAME" --json tagName,isDraft,isPrerelease,assets)
          echo "Release Info: $RELEASE_INFO"

          IS_DRAFT=$(echo "$RELEASE_INFO" | grep -o '"isDraft":true' || true)
          if [ -n "$IS_DRAFT" ]; then
            echo "ERROR: Release $TAG_NAME is a draft release, expected published release!"
            exit 1
          fi

          ASSET_NAME=$(echo "$RELEASE_INFO" | grep -o '"name":"[^"]*\.apk"' || true)
          if [ -z "$ASSET_NAME" ]; then
            echo "ERROR: GitHub Release created but APK asset upload failed."
            exit 1
          fi

          ASSET_SIZE=$(echo "$RELEASE_INFO" | grep -o '"size":[1-9][0-9]*' || true)
          if [ -z "$ASSET_SIZE" ]; then
            echo "ERROR: Release APK asset size is missing or 0 bytes!"
            exit 1
          fi

          echo "Testing APK asset download..."
          TEST_DIR=$(mktemp -d)
          if ! gh release download "$TAG_NAME" --pattern "*.apk" --dir "$TEST_DIR"; then
            echo "ERROR: GitHub Release created but APK asset download failed."
            rm -rf "$TEST_DIR"
            exit 1
          fi

          DOWNLOADED_APK=$(find "$TEST_DIR" -name "*.apk" | head -n 1)
          if [ -z "$DOWNLOADED_APK" ] || [ ! -s "$DOWNLOADED_APK" ]; then
            echo "ERROR: Downloaded APK asset is missing or empty."
            rm -rf "$TEST_DIR"
            exit 1
          fi

          echo "SUCCESS: Published Release $TAG_NAME verified with non-zero APK release asset ($DOWNLOADED_APK)."
          rm -rf "$TEST_DIR"

